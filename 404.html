<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<script src="shared-theme.js"></script>
<title>الصفحة غير موجودة — أكاديمية الشبكات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080a14;--text:#e8eaf6;--text-muted:#7a7f9e;--primary:#6c2fa0;--accent:#00c9b1}
html,body{height:100%;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);direction:rtl}
body::before{
  content:'';position:fixed;inset:0;
  background-image:
    linear-gradient(rgba(108,47,160,0.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(108,47,160,0.04) 1px,transparent 1px);
  background-size:60px 60px;pointer-events:none;
}
.wrap{
  position:relative;z-index:1;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2rem;
}
.code{font-size:6rem;font-weight:900;color:var(--primary);line-height:1;margin-bottom:0.5rem;opacity:0.6}
h1{font-size:1.5rem;font-weight:800;margin-bottom:0.5rem}
p{font-size:0.9rem;color:var(--text-muted);margin-bottom:1.5rem;line-height:1.7}
.btn{
  display:inline-flex;align-items:center;gap:0.4rem;
  padding:0.7rem 1.8rem;background:linear-gradient(135deg,var(--primary),#8b46c8);
  border:none;border-radius:8px;color:#fff;font-family:'Cairo',sans-serif;
  font-size:0.9rem;font-weight:700;cursor:pointer;text-decoration:none;
  transition:all 0.25s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(108,47,160,0.35)}
</style>
</head>
<body>
<div class="wrap">
  <div class="code">404</div>
  <h1>الصفحة غير موجودة</h1>
  <p>يبدو أن الرابط خاطئ أو أن الصفحة نُقلت لمكان آخر</p>
  <a href="index.html" class="btn">🏠 العودة للرئيسية</a>
</div>
</body>
</html>
