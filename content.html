<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6c2fa0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="shared-theme.js"></script>
<title>محتوى القسم — أكاديمية الشبكات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080a14; --bg2: #0e1022; --bg3: #161833;
  --card: #12142a; --card2: #1a1c3a;
  --primary: #6c2fa0; --primary-l: #8b46c8;
  --accent: #00c9b1; --accent-d: #009e8e;
  --text: #e8e6f0; --text-muted: #8c90b5; --text-faint: #555880;
  --border: #23264a; --border2: #2e3160;
  --radius: 12px;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ─── SECTION INFO HEADER ─── */
.section-hero {
  padding: 5rem 1.5rem 1.5rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.section-hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(108,47,160,0.15) 0%, transparent 70%);
  pointer-events: none;
}
.section-num {
  display: inline-block;
  background: linear-gradient(135deg, var(--primary), var(--primary-l));
  color: #fff;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 0.3rem 1rem;
  border-radius: 20px;
  margin-bottom: 1rem;
}
.section-title {
  font-size: 2rem;
  font-weight: 900;
  color: var(--text);
  margin-bottom: 0.5rem;
  line-height: 1.4;
}
.section-title span { color: var(--accent); }
.section-subtitle {
  font-size: 0.9rem;
  color: var(--text-muted);
  max-width: 500px;
  margin: 0 auto;
}

/* ─── PDF / SLIDES VIEWER ─── */
.pdf-container {
  max-width: 1400px;
  margin: 0 auto 3rem;
  padding: 0 0.5rem;
}
.pdf-frame-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  min-height: 500px;
}
.pdf-frame-wrap iframe {
  width: 100%;
  height: 85vh;
  border: none;
  display: block;
}
/* وضع Slides: نسبة 16:9 تستغل العرض بالكامل */
.slides-mode .pdf-container {
  max-width: 100%;
  padding: 0;
}
.slides-mode .pdf-frame-wrap {
  border-radius: 0;
  border-left: none;
  border-right: none;
}
.slides-mode .pdf-frame-wrap iframe {
  height: 88vh;
}
.pdf-toolbar {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0.6rem 1rem;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.pdf-toolbar-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
}

/* ─── LOADING & EMPTY ─── */
.pdf-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 400px;
  color: var(--text-muted);
  font-size: 0.9rem;
  gap: 1rem;
}
.pdf-loading .spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.pdf-empty {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-faint);
}
.pdf-empty-icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
.pdf-empty-msg { font-size: 0.9rem; line-height: 1.8; }

/* ─── RESPONSIVE ─── */
@media (max-width: 600px) {
  .section-hero { padding: 4.5rem 1rem 1rem; }
  .section-title { font-size: 1.5rem; }
  .pdf-frame-wrap iframe { height: 75vh; }
  .slides-mode .pdf-frame-wrap iframe { height: 35vh; }
}
@media (min-width: 601px) and (max-width: 1024px) {
  .slides-mode .pdf-frame-wrap iframe { height: 60vh; }
}
/* إخفاء شعار الشريط العلوي */
.nav-logo { display: none !important; }
.nav-current-sep { display: none !important; }
</style>
</head>
<body>
<script src="shared-nav.js"></script>

<!-- ── SECTION HERO ── -->
<div class="section-hero">
  <div class="section-num" id="sectionNum">القسم</div>
  <h1 class="section-title" id="sectionTitle">جارٍ التحميل…</h1>
  <p class="section-subtitle" id="sectionSubtitle"></p>
</div>

<!-- ── PDF VIEWER ── -->
<div class="pdf-container">
  <div id="pdfLoading" class="pdf-loading">
    <div class="spinner"></div>
    جارٍ تحميل المحتوى…
  </div>

  <div id="pdfEmpty" class="pdf-empty" style="display:none;">
    <span class="pdf-empty-icon">📄</span>
    <div class="pdf-empty-msg">لم يتم رفع محتوى لهذا القسم بعد.<br>يرجى التواصل مع المشرف.</div>
  </div>

  <div id="pdfViewer" style="display:none;">
    <div class="pdf-frame-wrap">
      <div class="pdf-toolbar">
        <div class="pdf-toolbar-title" id="pdfToolbarTitle">📖 محتوى القسم</div>
      </div>
      <iframe id="pdfIframe" allowfullscreen></iframe>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCz9Wedr_X3VzoaH0gJj8QCxksetbIKMYM",
  authDomain: "networkacademy-795c8.firebaseapp.com",
  projectId: "networkacademy-795c8"
});
const db = getFirestore(app);

/* ── الأقسام ── */
const SECTIONS = {
  networks: { title: "شبكات الحاسب الآلي", num: "القسم الأول", icon: "📡", subtitle: "مقدمة في شبكات الحاسب وأنواعها ومكوناتها" },
  security: { title: "الأمان في الشبكات", num: "القسم الثاني", icon: "🔒", subtitle: "التهديدات وحلول الأمان في الشبكات" },
  osi:      { title: "نموذج OSI", num: "القسم الثالث", icon: "🔁", subtitle: "طبقات نموذج الاتصال المعياري" },
  cables:   { title: "كيابل الشبكات", num: "القسم الرابع", icon: "🔌", subtitle: "أنواع الكابلات ومواصفاتها وأدوات التصنيع" },
  ip:       { title: "بروتوكول IP", num: "القسم الخامس", icon: "🌍", subtitle: "العنونة والبروتوكولات في الشبكات" }
};

/* ── تحديد القسم من URL ── */
const params = new URLSearchParams(location.search);
const sectionId = params.get("section") || "networks";
const section = SECTIONS[sectionId] || SECTIONS.networks;

/* ── تحديث العنوان ── */
document.title = `${section.title} — أكاديمية الشبكات`;
document.getElementById("sectionNum").textContent = `${section.icon} ${section.num}`;
document.getElementById("sectionTitle").innerHTML = section.title;
document.getElementById("sectionSubtitle").textContent = section.subtitle;
document.getElementById("pdfToolbarTitle").textContent = `📖 ${section.title}`;

/* ── جلب المحتوى من Firestore (Slides أو PDF) ── */
async function loadContent() {
  const loadingEl = document.getElementById("pdfLoading");
  const emptyEl = document.getElementById("pdfEmpty");
  const viewerEl = document.getElementById("pdfViewer");

  try {
    const snap = await getDoc(doc(db, "settings", "pdfLinks"));
    const data = snap.exists() ? snap.data() : {};

    /* ── أولاً: تحقق من وجود رابط Google Slides للقسم ── */
    const slidesKey = `slides_${sectionId}`;
    const slidesUrl = data[slidesKey];

    if (slidesUrl && slidesUrl.trim()) {
      /* ── عرض Google Slides ── */
      let embedUrl = slidesUrl.trim();

      // استخراج ID العرض التقديمي من أنماط الروابط المختلفة
      // نمط 1: https://docs.google.com/presentation/d/PRESENTATION_ID/...
      const slideMatch = embedUrl.match(/\/presentation\/d\/([a-zA-Z0-9_-]+)/);
      // نمط 2: https://docs.google.com/presentation/d/e/PUBLISHED_ID/...
      const pubMatch = embedUrl.match(/\/presentation\/d\/e\/([a-zA-Z0-9_-]+)/);

      if (pubMatch) {
        // رابط منشور — نستخدمه كما هو مع embed
        embedUrl = `https://docs.google.com/presentation/d/e/${pubMatch[1]}/embed?start=false&loop=false&delayms=0`;
      } else if (slideMatch) {
        // رابط عادي — نحوّله لرابط embed
        embedUrl = `https://docs.google.com/presentation/d/${slideMatch[1]}/embed?start=false&loop=false&delayms=0`;
      }
      // إذا لم يتطابق مع أي نمط، نستخدمه كما هو (قد يكون رابط embed جاهز)

      document.getElementById("pdfToolbarTitle").textContent = `📊 ${section.title}`;
      document.getElementById("pdfIframe").src = embedUrl;
      document.body.classList.add("slides-mode");
      loadingEl.style.display = "none";
      viewerEl.style.display = "block";
      return;
    }

    /* ── ثانياً: عرض PDF (السلوك الأصلي) ── */
    const rawUrl = data[sectionId];

    if (!rawUrl || !rawUrl.trim()) {
      loadingEl.style.display = "none";
      emptyEl.style.display = "block";
      return;
    }

    /* تحويل رابط Google Drive للعرض المباشر */
    let pdfEmbed = rawUrl.trim();
    
    // رابط مشاركة عادي: https://drive.google.com/file/d/FILE_ID/view?...
    const match = pdfEmbed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (match) {
      pdfEmbed = `https://drive.google.com/file/d/${match[1]}/preview`;
    }
    // رابط open: https://drive.google.com/open?id=FILE_ID
    const match2 = pdfEmbed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (match2 && !match) {
      pdfEmbed = `https://drive.google.com/file/d/${match2[1]}/preview`;
    }

    window._currentPdfUrl = rawUrl;
    window._currentPdfEmbed = pdfEmbed;

    document.getElementById("pdfIframe").src = pdfEmbed;
    loadingEl.style.display = "none";
    viewerEl.style.display = "block";

  } catch (e) {
    console.error("loadContent:", e);
    loadingEl.style.display = "none";
    emptyEl.style.display = "block";
  }
}

loadContent();

/* ── أزرار ── */
window.openPdfNewTab = function() {
  if (window._currentPdfUrl) window.open(window._currentPdfUrl, "_blank");
};
window.downloadPdf = function() {
  if (window._currentPdfUrl) {
    const match = window._currentPdfUrl.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (match) {
      window.open(`https://drive.google.com/uc?export=download&id=${match[1]}`, "_blank");
    } else {
      window.open(window._currentPdfUrl, "_blank");
    }
  }
};
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>

<!-- ── حماية المحتوى ── -->
<script>
(function() {
  // منع القائمة السياقية (الزر الأيمن)
  document.addEventListener("contextmenu", function(e) { e.preventDefault(); return false; });

  // منع النسخ والقص
  ["copy", "cut"].forEach(function(evt) {
    document.addEventListener(evt, function(e) { e.preventDefault(); return false; });
  });

  // منع تحديد النصوص
  var s = document.createElement("style");
  s.textContent = "body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}";
  document.head.appendChild(s);

  // منع اختصارات المطوّر
  document.addEventListener("keydown", function(e) {
    var k = (e.key || "").toLowerCase();
    // F12
    if (k === "f12") { e.preventDefault(); return false; }
    // Ctrl+Shift+I/J/C/K
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && ["i","j","c","k"].indexOf(k) !== -1) { e.preventDefault(); return false; }
    // Ctrl+U (View source)
    if ((e.ctrlKey || e.metaKey) && k === "u") { e.preventDefault(); return false; }
    // Ctrl+S (Save)
    if ((e.ctrlKey || e.metaKey) && k === "s") { e.preventDefault(); return false; }
    // Ctrl+P (Print)
    if ((e.ctrlKey || e.metaKey) && k === "p") { e.preventDefault(); return false; }
  });

  // منع السحب
  document.addEventListener("dragstart", function(e) { e.preventDefault(); return false; });
})();
</script>
</body>
</html>
