<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6c2fa0">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="shared-theme.js"></script>
<title>محتوى القسم — أكاديمية الشبكات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080a14; --bg2: #0e1022; --bg3: #161833;
  --card: #12142a; --card2: #1a1c3a;
  --primary: #6c2fa0; --primary-l: #8b46c8;
  --accent: #00c9b1; --accent-d: #009e8e;
  --text: #e8e6f0; --text-muted: #8c90b5; --text-faint: #555880;
  --border: #23264a; --border2: #2e3160;
  --radius: 12px;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ─── SECTION INFO HEADER ─── */
.section-hero {
  padding: 5rem 1.5rem 1.5rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.section-hero::before {
  content: '';
  position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 0%, rgba(108,47,160,0.15) 0%, transparent 70%);
  pointer-events: none;
}
.section-num {
  display: inline-block;
  background: linear-gradient(135deg, var(--primary), var(--primary-l));
  color: #fff;
  font-size: 0.75rem;
  font-weight: 700;
  padding: 0.3rem 1rem;
  border-radius: 20px;
  margin-bottom: 1rem;
}
.section-title {
  font-size: 2rem;
  font-weight: 900;
  color: var(--text);
  margin-bottom: 0.5rem;
  line-height: 1.4;
}
.section-title span { color: var(--accent); }
.section-subtitle {
  font-size: 0.9rem;
  color: var(--text-muted);
  max-width: 500px;
  margin: 0 auto;
}

/* ─── PDF VIEWER ─── */
.pdf-container {
  max-width: 1400px;
  margin: 0 auto 3rem;
  padding: 0 0.5rem;
}
.pdf-frame-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  min-height: 500px;
}
.pdf-frame-wrap iframe {
  width: 100%;
  height: 92vh;
  border: none;
  display: block;
}
.pdf-top-shield {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50px;
  z-index: 10;
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: center;
  border-bottom: 1px solid var(--border);
}
.pdf-top-shield-title {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text);
}
.pdf-bottom-shield {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 4px;
  z-index: 10;
  background: var(--card);
}

/* ─── SLIDES VIEWER (صور) ─── */
.slides-viewer {
  max-width: 850px;
  margin: 0 auto 1rem;
  padding: 0 0.5rem;
}
.slides-mode .section-hero {
  padding: 3.5rem 1rem 0.3rem;
}
.slides-mode .section-num { font-size: 0.65rem; padding: 0.2rem 0.7rem; margin-bottom: 0.3rem; }
.slides-mode .section-title { font-size: 1.2rem; margin-bottom: 0.1rem; }
.slides-mode .section-subtitle { font-size: 0.72rem; margin-bottom: 0; }
.slides-img-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.slides-img-wrap img {
  width: 100%;
  height: auto;
  display: block;
  transition: opacity 0.3s ease;
}
.slides-img-wrap img.loading { opacity: 0.3; }
.slides-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1rem;
  margin-top: 1rem;
  direction: ltr;
}
.slides-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 1.2rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.slides-btn:hover:not(:disabled) { background: var(--primary); border-color: var(--primary); color: #fff; }
.slides-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.slides-counter {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-muted);
  min-width: 70px;
  text-align: center;
  direction: ltr;
}
.slides-progress-wrap {
  max-width: 400px;
  margin: 0.75rem auto 0;
  height: 3px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
}
.slides-progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), var(--accent));
  border-radius: 2px;
  transition: width 0.3s ease;
}
/* ─── LOADING & EMPTY ─── */
.pdf-loading {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 400px;
  color: var(--text-muted);
  font-size: 0.9rem;
  gap: 1rem;
}
.pdf-loading .spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.pdf-empty {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-faint);
}
.pdf-empty-icon { font-size: 3rem; margin-bottom: 1rem; display: block; }
.pdf-empty-msg { font-size: 0.9rem; line-height: 1.8; }

/* ─── RESPONSIVE: Mobile ─── */
@media (max-width: 600px) {
  .section-hero { padding: 4.5rem 1rem 1rem; }
  .section-title { font-size: 1.5rem; }
  .pdf-frame-wrap iframe { height: 80vh; }
  .pdf-top-shield { height: 40px; }
  .pdf-top-shield-title { font-size: 0.75rem; }
  .slides-viewer { padding: 0 0.25rem; }
  .slides-btn { width: 38px; height: 38px; font-size: 1rem; }
  .slides-counter { font-size: 0.78rem; }
  .slides-mode .section-hero { padding: 3.2rem 1rem 0.2rem; }
  .slides-mode .section-num { display: none; }
  .slides-mode .section-title { font-size: 1rem; }
  .slides-mode .section-subtitle { display: none; }
}
/* إخفاء شعار الشريط العلوي */
.nav-logo { display: none !important; }
.nav-current-sep { display: none !important; }
</style>
</head>
<body>
<script src="shared-nav.js"></script>

<!-- ── SECTION HERO ── -->
<div class="section-hero">
  <div class="section-num" id="sectionNum">القسم</div>
  <h1 class="section-title" id="sectionTitle">جارٍ التحميل…</h1>
  <p class="section-subtitle" id="sectionSubtitle"></p>
</div>

<!-- ── PDF VIEWER ── -->
<div class="pdf-container">
  <div id="pdfLoading" class="pdf-loading">
    <div class="spinner"></div>
    جارٍ تحميل المحتوى…
  </div>

  <div id="pdfEmpty" class="pdf-empty" style="display:none;">
    <span class="pdf-empty-icon">📄</span>
    <div class="pdf-empty-msg">لم يتم رفع محتوى لهذا القسم بعد.<br>يرجى التواصل مع المشرف.</div>
  </div>

  <div id="pdfViewer" style="display:none;">
    <div class="pdf-frame-wrap">
      <div class="pdf-top-shield">
        <span class="pdf-top-shield-title" id="pdfShieldTitle">📖 محتوى القسم</span>
      </div>
      <iframe id="pdfIframe" allowfullscreen></iframe>
      <div class="pdf-bottom-shield"></div>
    </div>
  </div>

  <!-- عارض الصور (Slides) -->
  <div id="slidesViewer" style="display:none;" class="slides-viewer">
    <div class="slides-img-wrap">
      <img id="slideImg" src="" alt="شريحة" draggable="false">
    </div>
    <div class="slides-nav">
      <button class="slides-btn" id="btnPrevSlide" onclick="prevSlide()">&#9664;</button>
      <div class="slides-counter"><span id="slideCurrentNum">1</span> / <span id="slideTotalNum">1</span></div>
      <button class="slides-btn" id="btnNextSlide" onclick="nextSlide()">&#9654;</button>
    </div>
    <div class="slides-progress-wrap">
      <div class="slides-progress-bar" id="slidesProgressBar" style="width:0%"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCz9Wedr_X3VzoaH0gJj8QCxksetbIKMYM",
  authDomain: "networkacademy-795c8.firebaseapp.com",
  projectId: "networkacademy-795c8"
});
const db = getFirestore(app);
const auth = getAuth(app);

/* ── الأقسام الافتراضية (fallback) ── */
const DEFAULT_SECTIONS = {
  networks: { title: "شبكات الحاسب الآلي", num: "القسم الأول", icon: "📡", subtitle: "مقدمة في شبكات الحاسب وأنواعها ومكوناتها" },
  security: { title: "الأمان في الشبكات", num: "القسم الثاني", icon: "🔒", subtitle: "التهديدات وحلول الأمان في الشبكات" },
  osi:      { title: "نموذج OSI", num: "القسم الثالث", icon: "🔁", subtitle: "طبقات نموذج الاتصال المعياري" },
  cables:   { title: "كيابل الشبكات", num: "القسم الرابع", icon: "🔌", subtitle: "أنواع الكابلات ومواصفاتها وأدوات التصنيع" },
  ip:       { title: "بروتوكول IP", num: "القسم الخامس", icon: "🌍", subtitle: "العنونة والبروتوكولات في الشبكات" }
};
const NUM_LABELS = ["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر"];

/* ── تحديد القسم من URL ── */
const params = new URLSearchParams(location.search);
const sectionId = params.get("section") || "networks";

/* ── جلب بيانات القسم من Firestore أو الافتراضي ── */
let section = DEFAULT_SECTIONS[sectionId] || { title: sectionId, num: "", icon: "📄", subtitle: "" };

(async function loadSectionMeta() {
  try {
    const secSnap = await getDoc(doc(db, "settings", "sections"));
    if (secSnap.exists() && secSnap.data().list) {
      const list = secSnap.data().list.filter(s => s.visible !== false).sort((a,b) => (a.order||0) - (b.order||0));
      const idx = list.findIndex(s => s.id === sectionId);
      if (idx !== -1) {
        const s = list[idx];
        section = {
          title: s.title || sectionId,
          num: "القسم " + (NUM_LABELS[idx] || (idx + 1)),
          icon: s.icon || "📄",
          subtitle: s.subtitle || ""
        };
      }
    }
  } catch(e) { /* نستخدم الافتراضي */ }

  /* ── تحديث العنوان ── */
  document.title = `${section.title} — أكاديمية الشبكات`;
  document.getElementById("sectionNum").textContent = `${section.icon} ${section.num}`;
  document.getElementById("sectionTitle").innerHTML = section.title;
  document.getElementById("sectionSubtitle").textContent = section.subtitle;
  document.getElementById("pdfShieldTitle").textContent = `📖 ${section.title}`;
})();

/* ── جلب المحتوى: صور (slides) أولاً، ثم PDF كـ fallback ── */
const SLIDES_BASE = "slides"; /* مجلد الصور في GitHub: slides/{sectionId}/1.png */
let _slides = { current: 1, total: 0 };

async function loadContent() {
  const loadingEl = document.getElementById("pdfLoading");
  const emptyEl = document.getElementById("pdfEmpty");
  const pdfViewer = document.getElementById("pdfViewer");
  const slidesViewer = document.getElementById("slidesViewer");

  try {
    /* جلب إعدادات الأقسام + روابط PDF بالتوازي */
    const [secSnap, pdfSnap] = await Promise.all([
      getDoc(doc(db, "settings", "sections")),
      getDoc(doc(db, "settings", "pdfLinks"))
    ]);

    const secData = secSnap.exists() ? secSnap.data() : {};
    const pdfData = pdfSnap.exists() ? pdfSnap.data() : {};

    /* البحث عن عدد شرائح هذا القسم */
    let slidesCount = 0;
    if (secData.list) {
      const sec = secData.list.find(s => s.id === sectionId);
      if (sec && sec.slidesCount && Number(sec.slidesCount) > 0) {
        slidesCount = Number(sec.slidesCount);
      }
    }

    /* ── الوضع 1: عرض صور (إذا حُدد عدد الشرائح) ── */
    if (slidesCount > 0) {
      _slides.total = slidesCount;
      _slides.current = 1;

      document.getElementById("slideTotalNum").textContent = slidesCount;
      document.getElementById("slideCurrentNum").textContent = "1";

      const img = document.getElementById("slideImg");
      img.src = `${SLIDES_BASE}/${sectionId}/1.png`;
      img.classList.add("loading");
      img.onload = () => img.classList.remove("loading");

      loadingEl.style.display = "none";
      slidesViewer.style.display = "block";
      document.body.classList.add("slides-mode");

      updateSlideNav();
      preloadNextSlide(2);
      return;
    }

    /* ── الوضع 2: عرض PDF من Google Drive ── */
    const rawUrl = pdfData[sectionId];

    if (!rawUrl || !rawUrl.trim()) {
      loadingEl.style.display = "none";
      emptyEl.style.display = "block";
      return;
    }

    let pdfEmbed = rawUrl.trim();
    const match = pdfEmbed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
    if (match) {
      pdfEmbed = `https://drive.google.com/file/d/${match[1]}/preview`;
    }
    const match2 = pdfEmbed.match(/[?&]id=([a-zA-Z0-9_-]+)/);
    if (match2 && !match) {
      pdfEmbed = `https://drive.google.com/file/d/${match2[1]}/preview`;
    }

    document.getElementById("pdfIframe").src = pdfEmbed;
    loadingEl.style.display = "none";
    pdfViewer.style.display = "block";

  } catch (e) {
    console.error("loadContent:", e);
    loadingEl.style.display = "none";
    emptyEl.style.display = "block";
  }
}

/* ── التنقل بين الشرائح ── */
window.nextSlide = function() {
  if (_slides.current >= _slides.total) return;
  _slides.current++;
  showSlide(_slides.current);
};

window.prevSlide = function() {
  if (_slides.current <= 1) return;
  _slides.current--;
  showSlide(_slides.current);
};

function showSlide(num) {
  const img = document.getElementById("slideImg");
  img.classList.add("loading");
  img.src = `${SLIDES_BASE}/${sectionId}/${num}.png`;
  img.onload = () => img.classList.remove("loading");
  document.getElementById("slideCurrentNum").textContent = num;
  updateSlideNav();
  preloadNextSlide(num + 1);
}

function updateSlideNav() {
  document.getElementById("btnPrevSlide").disabled = (_slides.current <= 1);
  document.getElementById("btnNextSlide").disabled = (_slides.current >= _slides.total);
  const pct = (_slides.current / _slides.total * 100).toFixed(0);
  document.getElementById("slidesProgressBar").style.width = pct + "%";
}

function preloadNextSlide(num) {
  if (num > _slides.total) return;
  const img = new Image();
  img.src = `${SLIDES_BASE}/${sectionId}/${num}.png`;
}

/* دعم أزرار لوحة المفاتيح */
document.addEventListener("keydown", function(e) {
  if (e.key === "ArrowRight" || e.key === "ArrowDown") { nextSlide(); e.preventDefault(); }
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { prevSlide(); e.preventDefault(); }
});

loadContent();

/* ── تسجيل تقدم المتدرب (مشاهدة القسم) ── */
onAuthStateChanged(auth, async (user) => {
  if (!user) return;
  try {
    const progressRef = doc(db, "progress", user.uid);
    const snap = await getDoc(progressRef);
    const current = snap.exists() ? snap.data() : {};

    // إذا لم يكمل هذا القسم بعد، سجّل 100% (شاهده)
    if (!current[sectionId] || Number(current[sectionId]) < 100) {
      await setDoc(progressRef, { [sectionId]: 100 }, { merge: true });
    }
  } catch(e) { console.warn("progress track:", e); }
});

</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script>
<script src="quiz-widget.js"></script>

<!-- ── حماية المحتوى ── -->
<script>
(function() {
  // منع القائمة السياقية (الزر الأيمن)
  document.addEventListener("contextmenu", function(e) { e.preventDefault(); return false; });

  // منع النسخ والقص
  ["copy", "cut"].forEach(function(evt) {
    document.addEventListener(evt, function(e) { e.preventDefault(); return false; });
  });

  // منع تحديد النصوص
  var s = document.createElement("style");
  s.textContent = "body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;}";
  document.head.appendChild(s);

  // منع اختصارات المطوّر
  document.addEventListener("keydown", function(e) {
    var k = (e.key || "").toLowerCase();
    // F12
    if (k === "f12") { e.preventDefault(); return false; }
    // Ctrl+Shift+I/J/C/K
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && ["i","j","c","k"].indexOf(k) !== -1) { e.preventDefault(); return false; }
    // Ctrl+U (View source)
    if ((e.ctrlKey || e.metaKey) && k === "u") { e.preventDefault(); return false; }
    // Ctrl+S (Save)
    if ((e.ctrlKey || e.metaKey) && k === "s") { e.preventDefault(); return false; }
    // Ctrl+P (Print)
    if ((e.ctrlKey || e.metaKey) && k === "p") { e.preventDefault(); return false; }
  });

  // منع السحب
  document.addEventListener("dragstart", function(e) { e.preventDefault(); return false; });
})();
</script>
</body>
</html>
