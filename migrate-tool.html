<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أداة نقل بيانات أكاديمية الشبكات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#080a14;color:#e8eaf6;min-height:100vh;padding:2rem}
.container{max-width:800px;margin:0 auto}
h1{font-size:1.6rem;font-weight:800;text-align:center;margin-bottom:0.3rem;background:linear-gradient(135deg,#6c2fa0,#00c9b1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{text-align:center;color:rgba(255,255,255,0.5);font-size:0.85rem;margin-bottom:2rem}
.card{background:#0e1022;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:1.5rem;margin-bottom:1.2rem}
.card-title{font-size:1rem;font-weight:700;margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem}
.step-num{background:linear-gradient(135deg,#6c2fa0,#00c9b1);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:800;flex-shrink:0}
.info-box{background:rgba(0,201,177,0.06);border:1px solid rgba(0,201,177,0.15);border-radius:10px;padding:0.8rem 1rem;font-size:0.82rem;color:rgba(255,255,255,0.7);margin-bottom:1rem;line-height:1.7}
.btn{padding:0.7rem 1.8rem;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;transition:all 0.2s;display:inline-flex;align-items:center;gap:0.5rem}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-success{background:linear-gradient(135deg,#00c9b1,#0e7490);color:#fff}
.btn-group{display:flex;gap:0.7rem;flex-wrap:wrap;margin-top:1rem}
.log-box{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:1rem;margin-top:1rem;max-height:400px;overflow-y:auto;font-size:0.78rem;line-height:1.8;direction:ltr;text-align:left;font-family:'Courier New',monospace}
.log-box .ok{color:#00c9b1}
.log-box .err{color:#ff6b6b}
.log-box .warn{color:#d97706}
.log-box .inf{color:#7c3aed}
.progress-bar{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;margin-top:0.7rem;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#6c2fa0,#00c9b1);border-radius:3px;transition:width 0.3s;width:0%}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:0.7rem;margin-top:1rem}
.stat{background:rgba(108,47,160,0.08);border:1px solid rgba(108,47,160,0.15);border-radius:10px;padding:0.7rem;text-align:center}
.stat-num{font-size:1.3rem;font-weight:800;color:#00c9b1}
.stat-label{font-size:0.7rem;color:rgba(255,255,255,0.5);margin-top:0.2rem}
.warning-box{background:rgba(217,119,6,0.08);border:1px solid rgba(217,119,6,0.2);border-radius:10px;padding:0.8rem 1rem;font-size:0.82rem;color:#d97706;line-height:1.7}
</style>
</head>
<body>
<div class="container">
  <h1>🔄 أداة نقل بيانات أكاديمية الشبكات</h1>
  <p class="subtitle">النقل من المشروع القديم إلى سيرفر الدمام</p>

  <div class="card">
    <div class="card-title"><span class="step-num">1</span> نقل الحسابات (تم ✅)</div>
    <div class="info-box">الحسابات نُقلت بنجاح (46 حساب).</div>
  </div>

  <div class="card">
    <div class="card-title"><span class="step-num">2</span> نقل الإعدادات وبنك الأسئلة</div>
    <div class="info-box">ينقل: settings، questionBank، quizzes (هيكل الاختبارات بدون نتائج).</div>
    <div class="btn-group">
      <button class="btn btn-success" id="btnMigrate">📦 نقل البيانات</button>
    </div>
    <div id="log" class="log-box" style="display:none"></div>
    <div id="prog" class="progress-bar" style="display:none"><div class="progress-fill" id="progFill"></div></div>
  </div>

  <div class="card" id="statsCard" style="display:none">
    <div class="card-title"><span class="step-num">✓</span> ملخص النقل</div>
    <div class="stats" id="statsGrid"></div>
  </div>

  <div class="warning-box">⚠️ <strong>بعد النقل، احذف هذا الملف فوراً من GitHub.</strong></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, doc, setDoc, Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const OLD_PROJECT = "networkacademy-795c8";
const OLD_API_KEY = "AIzaSyCz9Wedr_X3VzoaH0gJj8QFrNIK5vT4vww";

const newApp = initializeApp({
  apiKey: "AIzaSyBYzGzvnahojCOP2lRPfr666tImtyH7miY",
  authDomain: "networkacademy-sa.firebaseapp.com",
  projectId: "networkacademy-sa",
  storageBucket: "networkacademy-sa.firebasestorage.app",
  messagingSenderId: "107120015847",
  appId: "1:107120015847:web:f06e2d6b6d23282463a542",
});
const newDb = getFirestore(newApp);

const _stats = {};

function log(msg, type) {
  const box = document.getElementById("log");
  box.style.display = "block";
  box.innerHTML += '<div class="' + type + '">' + new Date().toLocaleTimeString("en") + " — " + msg + "</div>";
  box.scrollTop = box.scrollHeight;
}

function setProg(pct) {
  document.getElementById("prog").style.display = "block";
  document.getElementById("progFill").style.width = pct + "%";
}

function showStats() {
  document.getElementById("statsCard").style.display = "block";
  var html = "";
  for (var k in _stats) {
    html += '<div class="stat"><div class="stat-num">' + _stats[k] + '</div><div class="stat-label">' + k + '</div></div>';
  }
  document.getElementById("statsGrid").innerHTML = html;
}

/* ─── REST: تسجيل دخول ─── */
async function getToken() {
  var url = "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + OLD_API_KEY;
  var res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: "admin@network.com", password: "Admin@2025", returnSecureToken: true })
  });
  var data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.idToken;
}

/* ─── REST: جلب مجموعة ─── */
async function fetchCol(token, colName) {
  var baseUrl = "https://firestore.googleapis.com/v1/projects/" + OLD_PROJECT + "/databases/(default)/documents/" + colName + "?pageSize=500";
  var allDocs = [];
  var pageToken = null;

  do {
    var url = pageToken ? baseUrl + "&pageToken=" + pageToken : baseUrl;
    var res = await fetch(url, { headers: { "Authorization": "Bearer " + token } });
    var data = await res.json();
    if (data.error) throw new Error(data.error.message);
    if (data.documents) {
      for (var i = 0; i < data.documents.length; i++) {
        allDocs.push(data.documents[i]);
      }
    }
    pageToken = data.nextPageToken || null;
  } while (pageToken);

  return allDocs;
}

/* ─── تحويل REST format إلى JS ─── */
function cv(val) {
  if (!val) return null;
  if ("stringValue" in val) return val.stringValue;
  if ("integerValue" in val) return Number(val.integerValue);
  if ("doubleValue" in val) return val.doubleValue;
  if ("booleanValue" in val) return val.booleanValue;
  if ("nullValue" in val) return null;
  if ("timestampValue" in val) {
    var d = new Date(val.timestampValue);
    return new Timestamp(Math.floor(d.getTime() / 1000), 0);
  }
  if ("mapValue" in val) return cf(val.mapValue.fields || {});
  if ("arrayValue" in val) {
    var arr = val.arrayValue.values || [];
    var result = [];
    for (var i = 0; i < arr.length; i++) result.push(cv(arr[i]));
    return result;
  }
  if ("referenceValue" in val) return val.referenceValue;
  return null;
}

function cf(fields) {
  var obj = {};
  for (var k in fields) {
    if (fields.hasOwnProperty(k)) {
      obj[k] = cv(fields[k]);
    }
  }
  return obj;
}

function getDocId(path) {
  var parts = path.split("/");
  return parts[parts.length - 1];
}

/* ═══════════ النقل ═══════════ */
var COLLECTIONS = ["settings", "questionBank", "quizzes"];

async function startMigration() {
  var btn = document.getElementById("btnMigrate");
  btn.disabled = true;
  btn.textContent = "⏳ جارٍ النقل...";

  try {
    log("جلب رمز المصادقة...", "inf");
    var token = await getToken();
    log("✅ تم الحصول على رمز المصادقة", "ok");

    var totalDocs = 0;

    for (var ci = 0; ci < COLLECTIONS.length; ci++) {
      var colName = COLLECTIONS[ci];
      setProg(Math.round(((ci + 1) / COLLECTIONS.length) * 100));
      log("📂 جارٍ جلب " + colName + "...", "inf");

      try {
        var docs = await fetchCol(token, colName);
        log("   وُجد " + docs.length + " مستند", "ok");

        var count = 0;
        for (var di = 0; di < docs.length; di++) {
          var rawDoc = docs[di];
          var docId = getDocId(rawDoc.name);
          var data = cf(rawDoc.fields || {});
          await setDoc(doc(newDb, colName, docId), data, { merge: true });
          count++;
          if (count % 20 === 0) {
            log("   ... " + count + "/" + docs.length, "ok");
          }
        }

        totalDocs += count;
        _stats[colName] = count;
        log("✅ " + colName + ": " + count + " مستند تم نقلها", "ok");

      } catch(e) {
        log("❌ " + colName + ": " + e.message, "err");
        _stats[colName] = "❌";
      }
    }

    _stats["الإجمالي"] = totalDocs;
    log("", "ok");
    log("🎉 اكتمل النقل بنجاح! إجمالي: " + totalDocs + " مستند", "ok");

  } catch(e) {
    log("❌ خطأ: " + e.message, "err");
  }

  showStats();
  btn.disabled = false;
  btn.textContent = "📦 نقل البيانات";
}

// ربط الزر
document.getElementById("btnMigrate").addEventListener("click", startMigration);
</script>
</body>
</html>
