<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقل بيانات المستخدمين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#080a14;color:#e8eaf6;min-height:100vh;padding:2rem}
.container{max-width:800px;margin:0 auto}
h1{font-size:1.4rem;font-weight:800;text-align:center;margin-bottom:1.5rem;color:#00c9b1}
.card{background:#0e1022;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:1.5rem;margin-bottom:1.2rem}
.btn{padding:0.7rem 1.8rem;border:none;border-radius:10px;font-family:'Cairo',sans-serif;font-weight:700;font-size:0.9rem;cursor:pointer;background:linear-gradient(135deg,#00c9b1,#0e7490);color:#fff;display:inline-flex;align-items:center;gap:0.5rem}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.log{background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:1rem;margin-top:1rem;max-height:400px;overflow-y:auto;font-size:0.78rem;line-height:1.8;direction:ltr;text-align:left;font-family:'Courier New',monospace}
.ok{color:#00c9b1} .err{color:#ff6b6b} .warn{color:#d97706} .inf{color:#7c3aed}
.warning-box{background:rgba(217,119,6,0.08);border:1px solid rgba(217,119,6,0.2);border-radius:10px;padding:0.8rem;font-size:0.82rem;color:#d97706;margin-top:1rem}
</style>
</head>
<body>
<div class="container">
  <h1>👥 نقل بيانات المستخدمين إلى المشروع الجديد</h1>

  <div class="card">
    <p style="font-size:0.85rem;color:rgba(255,255,255,0.7);margin-bottom:1rem;line-height:1.7;">
      يقرأ بيانات المستخدمين من المشروع القديم (الاسم، الرقم التدريبي، الدور)،<br>
      ثم يسجّل دخول كل مستخدم في المشروع الجديد للحصول على UID الصحيح،<br>
      ويكتب بياناته في Firestore الجديد بالـ UID الصحيح.
    </p>
    <button class="btn" id="btnStart">📦 نقل بيانات المستخدمين</button>
    <div id="log" class="log" style="display:none"></div>
  </div>

  <div class="warning-box">⚠️ احذف هذا الملف فوراً بعد الانتهاء.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const OLD_API_KEY = "AIzaSyCz9Wedr_X3VzoaH0gJj8QFrNIK5vT4vww";
const OLD_PROJECT = "networkacademy-795c8";
const NEW_API_KEY = "AIzaSyBYzGzvnahojCOP2lRPfr666tImtyH7miY";

const newApp = initializeApp({
  apiKey: NEW_API_KEY,
  authDomain: "networkacademy-sa.firebaseapp.com",
  projectId: "networkacademy-sa",
  storageBucket: "networkacademy-sa.firebasestorage.app",
  messagingSenderId: "107120015847",
  appId: "1:107120015847:web:f06e2d6b6d23282463a542",
});
const newDb = getFirestore(newApp);

function log(msg, type) {
  var box = document.getElementById("log");
  box.style.display = "block";
  box.innerHTML += '<div class="' + type + '">' + new Date().toLocaleTimeString("en") + " — " + msg + "</div>";
  box.scrollTop = box.scrollHeight;
}

// تسجيل دخول REST
async function signInREST(apiKey, email, password) {
  var res = await fetch("https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=" + apiKey, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: password, returnSecureToken: true })
  });
  var data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data;
}

// جلب مجموعة REST
async function fetchCol(token, colName) {
  var url = "https://firestore.googleapis.com/v1/projects/" + OLD_PROJECT + "/databases/(default)/documents/" + colName + "?pageSize=500";
  var res = await fetch(url, { headers: { "Authorization": "Bearer " + token } });
  var data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.documents || [];
}

function cv(val) {
  if (!val) return null;
  if ("stringValue" in val) return val.stringValue;
  if ("integerValue" in val) return Number(val.integerValue);
  if ("booleanValue" in val) return val.booleanValue;
  if ("nullValue" in val) return null;
  if ("timestampValue" in val) return new Timestamp(Math.floor(new Date(val.timestampValue).getTime() / 1000), 0);
  if ("mapValue" in val) { var o = {}; for (var k in (val.mapValue.fields||{})) o[k] = cv(val.mapValue.fields[k]); return o; }
  if ("arrayValue" in val) return (val.arrayValue.values || []).map(cv);
  return null;
}

async function start() {
  var btn = document.getElementById("btnStart");
  btn.disabled = true;
  btn.textContent = "⏳ جارٍ النقل...";

  try {
    // 1) تسجيل دخول المشرف في القديم وجلب users
    log("تسجيل دخول المشرف في المشروع القديم...", "inf");
    var oldAuth = await signInREST(OLD_API_KEY, "admin@network.com", "Admin@2025");
    log("✅ تم", "ok");

    log("جارٍ جلب بيانات المستخدمين...", "inf");
    var docs = await fetchCol(oldAuth.idToken, "users");
    log("وُجد " + docs.length + " مستخدم", "ok");

    // 2) لكل مستخدم: سجّل دخوله في المشروع الجديد للحصول على UID الصحيح
    var success = 0, errors = 0;

    for (var i = 0; i < docs.length; i++) {
      var rawDoc = docs[i];
      var fields = rawDoc.fields || {};
      var email = fields.email ? fields.email.stringValue : null;
      var displayName = fields.displayName ? fields.displayName.stringValue : "—";
      var studentId = fields.studentId ? fields.studentId.stringValue : "";
      var role = fields.role ? fields.role.stringValue : "trainee";

      if (!email) {
        log("⚠️ تخطّي بدون إيميل: " + displayName, "warn");
        continue;
      }

      // تحديد كلمة المرور
      var pwd = (role === "admin") ? "Admin@2025" : "Tt112233";

      try {
        // تسجيل دخول في المشروع الجديد للحصول على UID
        var newAuth = await signInREST(NEW_API_KEY, email, pwd);
        var newUid = newAuth.localId;

        // كتابة البيانات في Firestore الجديد
        await setDoc(doc(newDb, "users", newUid), {
          displayName: displayName,
          email: email,
          studentId: studentId,
          role: role,
        }, { merge: true });

        success++;
        var tag = (role === "admin") ? " [مشرف]" : "";
        log("✅ " + displayName + tag + " → " + newUid.substring(0, 8) + "...", "ok");

      } catch(e) {
        errors++;
        log("❌ " + email + ": " + e.message, "err");
      }
    }

    log("", "ok");
    log("🎉 اكتمل! نجاح: " + success + " | أخطاء: " + errors, "ok");

  } catch(e) {
    log("❌ خطأ: " + e.message, "err");
  }

  btn.disabled = false;
  btn.textContent = "📦 نقل بيانات المستخدمين";
}

document.getElementById("btnStart").addEventListener("click", start);
</script>
</body>
</html>
